name: Verify YouTube API setup
on:
  push:
    branches: [feature/youtube-daily-tracker]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify real YouTube collection
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/track_youtube.py
          python - <<'PY'
          import json
          data = json.load(open('assets/youtube/daily.json'))
          record = data['snapshots'][-1]
          print('Video:', data['title'])
          print('Views:', record['views'])
          print('Captured:', record['captured_at'])
          print('Comment status:', record['comment_status'])
          if record['top_comment']:
              print('Top comment likes:', record['top_comment']['likes'])
              print('Comment published:', record['top_comment']['published_at'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-youtube-snapshot
          path: assets/youtube/daily.json
          retention-days: 1
