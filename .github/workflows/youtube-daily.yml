name: Track YouTube daily views

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-daily.yml'
      - 'scripts/track_youtube.py'
  schedule:
    - cron: '55 15 * * *' # 23:55 Asia/Kuala_Lumpur; GitHub may run this late.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: youtube-daily-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect daily snapshot
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/track_youtube.py
      - name: Save history
        id: save
        run: |
          if git diff --quiet -- assets/youtube/daily.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/youtube/daily.json
            git commit -m 'Record daily YouTube snapshot'
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
    with:
      source_ref: main
