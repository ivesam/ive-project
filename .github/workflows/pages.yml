name: Deploy IVE landing page

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'script.js'
      - 'assets/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Commit or branch to publish after collection
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage website files
        run: |
          mkdir -p .pages
          cp index.html style.css script.js .nojekyll .pages/
          cp -R assets .pages/assets
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published landing page
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
          SITE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, time, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          query = '?verify=' + os.environ['SITE_COMMIT']
          for attempt in range(18):
              try:
                  def read(path):
                      request = urllib.request.Request(base + path + query, headers={'Cache-Control': 'no-cache'})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          return response.read().decode()
                  html = read('')
                  assert '<title>IVE — Looks Can Kill</title>' in html, 'Landing page title missing'
                  assert 'class="hero-video"' in html, 'Video hero missing'
                  assert 'id="schedule-drawer"' in html, 'Schedule drawer missing'
                  assert 'id="count-days"' in html, 'Countdown missing'
                  assert 'href="style.css' in html, 'Stylesheet link missing'
                  assert '.hero-video' in read('style.css'), 'Landing page stylesheet missing'
                  assert '<video id="hero-player"' in html, 'Native video background missing'
                  assert 'assets/ive-theater-background.mp4' in html, 'MP4 source missing'
                  script = read('script.js')
                  assert 'youtube.com/iframe_api' not in script, 'External video player still present'
                  assert 'function readFreeIPLocation' in script, 'Regional IP time-zone fix missing'
                  assert 'function tzlookup' in read('assets/vendor/tz-lookup.js'), 'Regional time-zone data missing'
                  request = urllib.request.Request(base + 'assets/ive-theater-background.mp4' + query, headers={'Range': 'bytes=0-31'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      assert b'ftyp' in response.read(32), 'Published MP4 is invalid'
                  print('Verified live landing page, stylesheet, and native MP4 background at ' + base)
                  break
              except Exception as error:
                  if attempt == 17:
                      raise
                  print('Waiting for published files: ' + str(error))
                  time.sleep(5)
          PY
