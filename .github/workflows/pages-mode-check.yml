name: Check and fix Pages deployment mode
on:
  push:
    branches: [fix/pages-deployment-conflict]
    paths: ['.github/workflows/pages-mode-check.yml']
permissions:
  contents: read
  pages: write
jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Use the Actions publishing pipeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source}'
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source}'
